[versions]
billingKtx = "9.1.0"
firebaseAuthKtx = "23.2.1"
firebaseDatabaseKtx = "21.0.0"
lottie = "6.7.1"
slf4j = "2.0.20"
securityCrypto = "1.1.0"

# Plugins / Lang
agp = "9.5.1"
kotlinBom = "2.4.21"
googleServices = "4.5.0"

# AndroidX / UI
coreKtx = "1.19.1"
appcompat = "1.8.0"
activity = "1.13.0"
fragmentKtx = "1.9.1"
constraintlayout = "2.2.2"
coreSplashscreen = "1.2.0"
material = "1.14.0"
shimmer = "0.5.0"
circleImageV = "3.1.0"
photoviewV = "2.3.0"

# Google Play / Maps / Ads / Places
appUpdateKtx = "2.1.0"
integrity = "1.6.0"
playServicesAds = "25.5.0"
playServicesAuth = "22.0.0"
playServicesLocation = "21.4.0"
playServicesMaps = "20.1.0"
places = "6.0.2"

# Auth / Credentials / Google ID
credentials = "1.6.0"
googleid = "1.2.1"

# Firebase (BOM manda versiones)
firebaseBom = "35.1.0"

# Glide
glide = "5.0.9"

# Google API Client / Auth
googleApiClient = "2.9.2"
googleAuthLibraryOauth2Http = "1.57.0"
# Recomendado si quieres evitar Apache HttpClient (descomenta la lib abajo y pon la versión que uses):
# googleHttpClientOkHttp = "1.44.1"

# Terceros
ccpV = "2.7.3"

# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]

billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billingKtx" }
firebase-auth-ktx = { module = "com.google.firebase:firebase-auth-ktx", version.ref = "firebaseAuthKtx" }
firebase-database-ktx = { module = "com.google.firebase:firebase-database-ktx", version.ref = "firebaseDatabaseKtx" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

# --- AndroidX / UI
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
shimmer = { module = "com.facebook.shimmer:shimmer", version.ref = "shimmer" }
cicleImage = { group = "de.hdodenhof", name = "circleimageview", version.ref = "circleImageV" }
photoview = { group = "com.github.chrisbanes", name = "PhotoView", version.ref = "photoviewV" }

# --- Google Play / Maps / Places / Ads
app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "appUpdateKtx" }
integrity = { module = "com.google.android.play:integrity", version.ref = "integrity" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }
places = { module = "com.google.android.libraries.places:places", version.ref = "places" }

# --- Credentials / Google ID
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# --- Firebase (SIN versión por módulo; BOM manda)
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebaseAuth = { group = "com.google.firebase", name = "firebase-auth" }
firebaseDatabase = { group = "com.google.firebase", name = "firebase-database" }
firebaseStorage = { group = "com.google.firebase", name = "firebase-storage" }
messaging = { group = "com.google.firebase", name = "firebase-messaging" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }

# --- Glide
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
# Si usas GlideApp:
# glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }

# --- Google API Client / Auth
google-api-client = { group = "com.google.api-client", name = "google-api-client", version.ref = "googleApiClient" }
google-auth-library-oauth2-http = { group = "com.google.auth", name = "google-auth-library-oauth2-http", version.ref = "googleAuthLibraryOauth2Http" }
# Transporte OkHttp del Google HTTP Client (opcional):
# google-http-client-okhttp = { module = "com.google.http-client:google-http-client-okhttp", version.ref = "googleHttpClientOkHttp" }

# --- Terceros
ccp = { group = "com.hbb20", name = "ccp", version.ref = "ccpV" }

# --- Kotlin BOM
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlinBom" }

# --- Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
googleService = { id = "com.google.gms.google-services", version.ref = "googleServices" }
