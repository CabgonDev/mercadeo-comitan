# ===== Gradle Performance =====
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Si tu maquina tiene muchos nucleos, puedes limitar workers (opcional)
# org.gradle.workers.max=8

# ===== Android & Kotlin =====
android.useAndroidX=true
android.nonTransitiveRClass=true
# Si usas librerias antiguas de support, activa Jetifier. Si no, mantenlo apagado.
# android.enableJetifier=true

# Kotlin
kotlin.code.style=official
# Compilaciones incrementales mas rapidas
kotlin.incremental=true
# kotlin.incremental.useClasspathSnapshot=true
# Evita fallar por validacion estricta del target (util al migrar)
kotlin.jvm.target.validation.mode=warning

# Descarga automatica de toolchains (por si tu Gradle no lo hace por defecto)
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# ===== Lint (opcional estricto en CI) =====
# android.lint.useSarif=true
# android.lint.absolutePaths=false
# android.lint.baseline=file("lint-baseline.xml")

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.r8.strictFullModeForKeepRules=false

